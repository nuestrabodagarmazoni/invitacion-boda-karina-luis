<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-verdeoliva-oscuro: #5c6633;
      --color-gris-claro: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    .seccion {
      text-align: center;
      padding: 2rem 1rem;
    }

    .titulo-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--color-verdeoliva-oscuro);
    }

    .separador {
      width: 60%;
      margin: 0.5rem auto 2rem auto;
      border: none;
      border-top: 2px solid var(--color-verdeoliva);
    }

    .titulo-seccion {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: var(--color-blanco);
      margin-bottom: 1rem;
    }

    .subtitulo-seccion {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      color: var(--color-blanco);
      margin-bottom: 2rem;
    }

    .cinta-verde {
      background-color: var(--color-verdeoliva);
      padding: 2rem 0;
    }

    .seccion-texto {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      line-height: 1.8;
      padding: 1rem;
      color: var(--color-verdeoliva-oscuro);
    }

    .boton {
      display: inline-block;
      background-color: var(--color-verdeoliva);
      color: var(--color-blanco);
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 5px;
      margin: 1rem 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .boton:hover {
      background-color: var(--color-verdeoliva-oscuro);
    }
  </style>
</head>
<body>
  <div class="seccion">
    <h1 class="titulo-principal">Karina <br /> & <br /> Luis</h1>
    <hr class="separador" />
  </div>

  <div class="cinta-verde">
    <h2 class="titulo-seccion">Ceremonia</h2>
    <p class="subtitulo-seccion">Día, Lugar</p>
  </div>

  <div class="cinta-verde">
    <h2 class="titulo-seccion">Recepción</h2>
    <p class="subtitulo-seccion">Día, Lugar</p>
  </div>

  <div class="seccion">
    <h2 class="titulo-principal">Galería de nuestro amor</h2>
    <hr class="separador" />
  </div>

  <div class="cinta-verde">
    <h2 class="titulo-seccion">Fiesta</h2>
    <p class="subtitulo-seccion">
      Invitados, sin niños <br />
      Código de vestimenta: Formal/Gala
    </p>
  </div>

  <div class="seccion">
    <h2 class="titulo-principal">Regalos</h2>
    <p class="seccion-texto">+ Info</p>
  </div>

  <div class="seccion">
    <h2 class="titulo-principal">Compartí con nosotros ese día</h2>
    <p class="seccion-texto">
      <button class="boton">Ingresar Link</button>
    </p>
  </div>

  <div class="seccion">
    <h1 class="titulo-principal">Karina <br /> & <br /> Luis</h1>
    <button class="boton">Sí, allí estaré.</button>
    <button class="boton">Lo siento, no podré asistir.</button>
  </div>
</body>
</html>
