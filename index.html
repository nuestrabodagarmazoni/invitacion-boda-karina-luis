<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-verdeoliva-oscuro: #5c6633;
      --color-gris-claro: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    /* Pantalla principal */
    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--color-blanco);
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    .mensaje-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--color-verdeoliva-oscuro);
      font-weight: 700; /* Negrita */
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4); /* Sombra negra difuminada */
    }

    .boton-aceptar {
      background-color: var(--color-verdeoliva);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-family: 'Montserrat', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: heartbeat 6s infinite; /* Animación más lenta */
    }

    .boton-aceptar:hover {
      background-color: var(--color-verdeoliva-oscuro);
      transform: translateY(-3px);
    }

    @keyframes heartbeat {
      0%, 50%, 100% {
        transform: scale(1);
      }
      25%, 75% {
        transform: scale(1.1); /* Efecto de latido */
      }
    }

    /* Lluvia de hojas */
    .hojas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }

    .hoja {
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: var(--color-verdeoliva);
      border-radius: 50%;
      animation: caer 5s linear;
    }

    @keyframes caer {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Imagen ajustada */
    .imagen-ajustada {
      display: none;
      width: 100%;
      height: auto;
      z-index: 300;
    }

    .imagen-ajustada.visible {
      display: block;
    }

    /* Botón flotante de audio */
    .boton-audio {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--color-verdeoliva);
      color: white;
      display: none; /* Oculto inicialmente */
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 400;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border: none;
      transition: all 0.3s ease;
    }

    .boton-audio.visible {
      display: flex; /* Mostrar el botón cuando sea visible */
    }

    .boton-audio:hover {
      background-color: var(--color-verdeoliva-oscuro);
      transform: scale(1.1);
    }

    .icono-audio {
      width: 24px;
      height: 24px;
    }

    .animacion-sonido path {
      animation: ondas 1.5s infinite ease-in-out;
    }

    .animacion-sonido path:nth-child(1) {
      animation-delay: 0s;
    }

    .animacion-sonido path:nth-child(2) {
      animation-delay: 0.2s;
    }

    .animacion-sonido path:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes ondas {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <!-- Pantalla Principal -->
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <!-- Lluvia de hojas -->
  <div class="hojas" id="hojas"></div>

  <!-- Imagen ajustada -->
  <img id="imagenAjustada" class="imagen-ajustada" src="https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/anillo.jpg?raw=true" alt="Imagen de invitación">

  <!-- Música de fondo -->
  <audio id="musicaFondo" loop>
    <source src="https://raw.githubusercontent.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/main/musica.mp3" type="audio/mp3">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <!-- Botón flotante de control de audio -->
  <button class="boton-audio" id="botonAudio" aria-label="Control de música">
    <svg class="icono-audio animacion-sonido" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15 8a5 5 0 0 1 0 8"></path>
      <path d="M19 5a9 9 0 0 1 0 14"></path>
    </svg>
  </button>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const hojas = document.getElementById('hojas');
      const imagenAjustada = document.getElementById('imagenAjustada');
      const musicaFondo = document.getElementById('musicaFondo');
      const botonAudio = document.getElementById('botonAudio');
      const iconoAudio = botonAudio.querySelector('.icono-audio');
      let isPlaying = false;
      let shouldResumeOnFocus = false;

      // Reproducir música con inicio gradual
      function playMusic() {
        musicaFondo.volume = 0; // Comienza con volumen 0
        musicaFondo.play();
        let fadeIn = setInterval(() => {
          if (musicaFondo.volume < 1) {
            musicaFondo.volume += 0.1;
          } else {
            clearInterval(fadeIn);
          }
        }, 100); // Incrementos cada 100ms
        isPlaying = true;
        iconoAudio.classList.add('animacion-sonido');
      }

      // Pausar música
      function pauseMusic() {
        musicaFondo.pause();
        isPlaying = false;
        iconoAudio.classList.remove('animacion-sonido');
      }

      // Toggle música (play/pause)
      botonAudio.addEventListener('click', function () {
        if (isPlaying) {
          pauseMusic();
        } else {
          playMusic();
        }
      });

      // Pausar música automáticamente al salir de la pestaña
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (isPlaying) {
            pauseMusic();
            shouldResumeOnFocus = true; // Marcar que debe reanudar al regresar
          }
        } else if (shouldResumeOnFocus) {
          playMusic();
          shouldResumeOnFocus = false; // Ya no necesita reanudar
        }
      });

      // Crear hojas dinámicamente (solo una vez)
      function crearHojas() {
        for (let i = 0; i < 50; i++) {
          const hoja = document.createElement('div');
          hoja.classList.add('hoja');
          hoja.style.left = Math.random() * 100 + 'vw';
          hoja.style.animationDuration = Math.random() * 2 + 4 + 's';
          hojas.appendChild(hoja);
        }
        setTimeout(() => {
          hojas.innerHTML = ''; // Limpiar hojas después de la animación
        }, 5000); // Duración de la animación
      }

      // Acción al presionar "Sí, acepto"
      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta');
        playMusic();

        // Mostrar el botón de audio
        botonAudio.classList.add('visible');

        // Generar la lluvia de hojas (solo una vez)
        crearHojas();

        // Mostrar imagen después de la lluvia de hojas
        setTimeout(() => {
          imagenAjustada.classList.add('visible');
        }, 500);
      });
    });
  </script>
</body>
</html>
