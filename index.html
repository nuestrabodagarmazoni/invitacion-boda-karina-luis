<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-verdeoliva-oscuro: #5c6633;
      --color-gris-claro: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--color-blanco);
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    .mensaje-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--color-verdeoliva-oscuro);
      font-weight: 700; /* Negrita */
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4); /* Sombra negra difuminada */
    }

    .boton-aceptar {
      background-color: var(--color-verdeoliva);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-family: 'Montserrat', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: heartbeat 4s infinite; /* Animación más lenta */
    }

    .boton-aceptar:hover {
      background-color: var(--color-verdeoliva-oscuro);
      transform: translateY(-3px);
    }

    @keyframes heartbeat {
      0%, 20%, 40%, 60%, 80%, 100% {
        transform: scale(1);
      }
      10%, 30%, 50%, 70%, 90% {
        transform: scale(1.1); /* Efecto de latido */
      }
    }

    .imagen-transicion {
      display: none; /* Oculto inicialmente */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--color-blanco);
      background-size: cover;
      background-position: center;
      z-index: 150;
      opacity: 0;
      transition: opacity 3s ease; /* Transición de desvanecimiento */
    }

    .imagen-transicion.visible {
      display: block;
      opacity: 1; /* Hacer visible con desvanecimiento */
    }

    .seccion {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5rem 2rem;
      text-align: center;
    }

    .titulo-seccion {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: var(--color-verdeoliva);
      margin-bottom: 2rem;
      font-weight: 600;
    }

    .contenido-seccion {
      max-width: 800px;
      margin: 0 auto;
      font-size: 1.2rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <!-- Pantalla Principal -->
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <!-- Imagen de transición -->
  <div id="imagenTransicion" class="imagen-transicion" style="background-image: url('https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/anillo.jpg?raw=true');"></div>

  <!-- Secciones de contenido -->
  <div id="contenido">
    <section class="seccion">
      <h2 class="titulo-seccion">Nuestra Historia</h2>
      <div class="contenido-seccion">
        <p>Estamos muy emocionados de compartir este día tan especial contigo.</p>
      </div>
    </section>
    <section class="seccion">
      <h2 class="titulo-seccion">Detalles del Evento</h2>
      <div class="contenido-seccion">
        <p>Fecha, lugar y más información importante.</p>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const imagenTransicion = document.getElementById('imagenTransicion');
      const contenido = document.getElementById('contenido');

      // Acción al presionar "Sí, acepto"
      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta');
        
        // Mostrar la imagen con la transición
        imagenTransicion.classList.add('visible');

        // Mantener la imagen visible por 5 segundos, luego scroll al contenido
        setTimeout(() => {
          imagenTransicion.classList.remove('visible'); // Ocultar imagen
          contenido.scrollIntoView({ behavior: 'smooth' }); // Scroll al contenido
        }, 5000);
      });
    });
  </script>
</body>
</html>
