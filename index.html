<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-verdeoliva-oscuro: #5c6633;
      --color-gris-claro: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    /* Pantalla principal */
    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--color-blanco);
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    .mensaje-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--color-verdeoliva-oscuro);
      font-weight: 700; /* Negrita */
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4); /* Sombra negra difuminada */
    }

    .boton-aceptar {
      background-color: var(--color-verdeoliva);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-family: 'Montserrat', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: heartbeat 4s infinite; /* Animación más lenta */
    }

    .boton-aceptar:hover {
      background-color: var(--color-verdeoliva-oscuro);
      transform: translateY(-3px);
    }

    @keyframes heartbeat {
      0%, 20%, 40%, 60%, 80%, 100% {
        transform: scale(1);
      }
      10%, 30%, 50%, 70%, 90% {
        transform: scale(1.1); /* Efecto de latido */
      }
    }

    /* Efecto de destello */
    .destello {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 60%);
      opacity: 0;
      z-index: 150;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .destello.visible {
      opacity: 1;
    }

    /* Lluvia de hojas */
    .hojas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }

    .hoja {
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: var(--color-verdeoliva);
      border-radius: 50%;
      animation: caer 5s linear infinite;
    }

    @keyframes caer {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Imagen ajustada */
    .imagen-ajustada {
      display: none;
      width: 100%;
      height: auto;
      z-index: 300;
    }

    .imagen-ajustada.visible {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Pantalla Principal -->
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <!-- Efecto de destello -->
  <div class="destello" id="destello"></div>

  <!-- Lluvia de hojas -->
  <div class="hojas" id="hojas"></div>

  <!-- Imagen ajustada -->
  <img id="imagenAjustada" class="imagen-ajustada" src="https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/anillo.jpg?raw=true" alt="Imagen de invitación">

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const destello = document.getElementById('destello');
      const hojas = document.getElementById('hojas');
      const imagenAjustada = document.getElementById('imagenAjustada');

      // Crear hojas dinámicamente
      function crearHojas() {
        for (let i = 0; i < 50; i++) {
          const hoja = document.createElement('div');
          hoja.classList.add('hoja');
          hoja.style.left = Math.random() * 100 + 'vw';
          hoja.style.animationDuration = Math.random() * 2 + 4 + 's';
          hojas.appendChild(hoja);
        }
      }
      crearHojas();

      // Acción al presionar "Sí, acepto"
      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta');

        // Mostrar efecto de destello
        destello.classList.add('visible');
        setTimeout(() => {
          destello.classList.remove('visible');
        }, 800);

        // Mostrar imagen y hojas
        setTimeout(() => {
          imagenAjustada.classList.add('visible');
          setTimeout(() => {
            imagenAjustada.classList.remove('visible');
            hojas.innerHTML = ""; // Limpiar las hojas
          }, 5000); // Mantener la imagen visible por 5 segundos
        }, 800);
      });
    });
  </script>
</body>
</html>
