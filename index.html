<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap');

    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-verdeoliva-claro: #b5c99a;
      --color-verdeoliva-oscuro: #5c6633;
      --color-gris-claro: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--color-blanco);
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    .mensaje-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--color-verdeoliva-oscuro);
      font-weight: 600;
    }

    .boton-aceptar {
      background-color: var(--color-verdeoliva);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-family: 'Montserrat', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: heartbeat 2s infinite;
    }

    .boton-aceptar:hover {
      background-color: var(--color-verdeoliva-oscuro);
      transform: translateY(-3px);
    }

    @keyframes heartbeat {
      0%, 20%, 40%, 60%, 80%, 100% {
        transform: scale(1);
      }
      10%, 30%, 50%, 70%, 90% {
        transform: scale(1.1);
      }
    }

    .invitacion {
      padding-top: 100vh;
      background-color: var(--color-blanco);
    }

    .seccion {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5rem 2rem;
      text-align: center;
      position: relative;
    }

    .seccion:nth-child(odd) {
      background-color: var(--color-gris-claro);
    }

    .titulo-seccion {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: var(--color-verdeoliva-oscuro);
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      position: relative;
      font-weight: 600;
    }

    .titulo-seccion::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background-color: var(--color-verdeoliva);
    }

    .contenido-seccion {
      max-width: 800px;
      margin: 0 auto;
      font-size: 1.2rem;
      line-height: 1.8;
    }

    .decoracion {
      font-size: 2rem;
      color: var(--color-verdeoliva-claro);
      margin: 2rem 0;
    }

    .boton-audio {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--color-verdeoliva);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 200;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border: none;
      transition: all 0.3s ease;
    }

    .boton-audio:hover {
      background-color: var(--color-verdeoliva-oscuro);
      transform: scale(1.1);
    }

    .icono-audio {
      width: 24px;
      height: 24px;
    }

    @media (max-width: 768px) {
      .mensaje-principal {
        font-size: 1.8rem;
      }
      .titulo-seccion {
        font-size: 2rem;
      }
      .contenido-seccion {
        font-size: 1rem;
      }
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <audio id="musicaFondo" loop>
    <source src="https://raw.githubusercontent.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/main/musica.mp3" type="audio/mp3" />
    Tu navegador no soporta el elemento de audio.
  </audio>

  <button class="boton-audio" id="botonAudio" aria-label="Controlar música de fondo">
    <svg class="icono-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path id="ondaSonido1" d="M15 8a5 5 0 0 1 0 8"></path>
      <path id="ondaSonido2" d="M19 5a9 9 0 0 1 0 14"></path>
    </svg>
  </button>

  <div class="invitacion" id="invitacion">
    <section class="seccion fade-in">
      <h2 class="titulo-seccion">TÍTULO PRINCIPAL</h2>
      <div class="decoracion">❧</div>
      <div class="contenido-seccion">
        <p>Aquí va el contenido de tu invitación.</p>
      </div>
    </section>
    <!-- Agrega más secciones como gustes -->
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const invitacion = document.getElementById('invitacion');
      const musica = document.getElementById('musicaFondo');
      const botonAudio = document.getElementById('botonAudio');
      const ondaSonido1 = document.getElementById('ondaSonido1');
      const ondaSonido2 = document.getElementById('ondaSonido2');
      const secciones = document.querySelectorAll('.fade-in');

      invitacion.style.display = 'none';

      let shouldPlayOnFocus = false;

      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta');
        invitacion.style.display = 'block';
        reproducirMusica();
        setTimeout(checkVisibility, 500);
      });

      botonAudio.addEventListener('click', function () {
        if (musica.paused) {
          reproducirMusica();
        } else {
          musica.pause();
          actualizarIconoAudio(false);
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden && !musica.paused) {
          musica.pause();
          shouldPlayOnFocus = true;
        } else if (!document.hidden && shouldPlayOnFocus) {
          reproducirMusica();
          shouldPlayOnFocus = false;
        }
      });

      window.addEventListener('blur', function () {
        if (!musica.paused) {
          musica.pause();
          shouldPlayOnFocus = true;
        }
      });

      window.addEventListener('focus', function () {
        if (pantallaPrincipal.classList.contains('oculta') && shouldPlayOnFocus) {
          reproducirMusica();
          shouldPlayOnFocus = false;
        }
      });

      function reproducirMusica() {
        musica.play().then(() => {
          actualizarIconoAudio(true);
        }).catch(err => {
          console.log('Error al reproducir música:', err);
        });
      }

      function actualizarIconoAudio(reproduciendo) {
        ondaSonido1.classList.toggle('hidden', !reproduciendo);
        ondaSonido2.classList.toggle('hidden', !reproduciendo);
      }

      function checkVisibility() {
        secciones.forEach(seccion => {
          const sectionTop = seccion.getBoundingClientRect().top;
          if (sectionTop < window.innerHeight * 0.85) {
            seccion.classList.add('visible');
          }
        });
      }

      window.addEventListener('scroll', checkVisibility);
    });
  </script>
</body>
</html>
