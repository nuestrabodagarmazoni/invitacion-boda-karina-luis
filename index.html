<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-dorado: #DAA520;
      --color-gris-claro: #f5f5f5;
      --color-gris-oscuro: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    /* Imagen "welcome" centrada */
    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/welcome.jpg?raw=true'); /* Link de fondo */
      background-size: auto 100%; /* Ajusta al alto de la pantalla */
      background-position: center; /* Centra la imagen */
      background-repeat: no-repeat; /* Evita repetición */
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    /* Imagen animada desde el borde inferior */
    .imagen-animada {
      position: fixed;
      top: 50%; /* Centrar verticalmente */
      left: 50%; /* Centrar horizontalmente */
      transform: translate(-50%, -50%); /* Ajustar para que el centro de la imagen coincida con el centro de la pantalla */
      width: 100%; /* Ajustar el ancho al 100% de la pantalla */
      height: auto; /* Mantener la proporción */
      animation: entrarDesdeAbajo 3s ease-in-out forwards;
    }

    /* Clase para activar la animación */
    .imagen-animada.activa {
      animation: entrarDesdeAbajo 3s ease-in-out forwards;
    }

    /* Animación para que la imagen suba */
    @keyframes entrarDesdeAbajo {
      0% {
        bottom: -100%; /* Fuera de la pantalla */
      }
      100% {
        bottom: 0; /* Hasta el borde superior */
      }
    }
  </style>
</head>
<body>
  <!-- Pantalla Principal -->
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <!-- Música de fondo -->
  <audio id="musicaFondo" loop>
    <source src="https://raw.githubusercontent.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/main/musica.mp3" type="audio/mp3">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <!-- Botón flotante de control de audio -->
  <button class="boton-audio" id="botonAudio" aria-label="Control de música">
    <svg class="icono-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15 8a5 5 0 0 1 0 8"></path>
      <path d="M19 5a9 9 0 0 1 0 14"></path>
    </svg>
  </button>

  <!-- Imagen animada -->
  <img src="https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/manos.jpg?raw=true" alt="Imagen animada" class="imagen-animada" id="imagenAnimada">

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const musicaFondo = document.getElementById('musicaFondo');
      const botonAudio = document.getElementById('botonAudio');
      const imagenAnimada = document.getElementById('imagenAnimada');

      let isPlaying = false;
      let shouldResumeOnFocus = false;

      // Reproducir música con inicio gradual
      function playMusic() {
        musicaFondo.volume = 0;
        musicaFondo.play();
        let fadeIn = setInterval(() => {
          if (musicaFondo.volume < 1) {
            musicaFondo.volume += 0.1;
          } else {
            clearInterval(fadeIn);
          }
        }, 100);
        isPlaying = true;
        botonAudio.classList.add('on'); // Cambiar estado del botón
      }

      // Pausar música
      function pauseMusic() {
        musicaFondo.pause();
        isPlaying = false;
        botonAudio.classList.remove('on'); // Cambiar estado del botón
      }

      // Alternar reproducción/pausa de música
      botonAudio.addEventListener('click', function () {
        if (isPlaying) {
          pauseMusic();
        } else {
          playMusic();
        }
      });

      // Pausar música automáticamente al salir de la pestaña
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (isPlaying) {
            pauseMusic();
            shouldResumeOnFocus = true; // Marcar que debe reanudar al regresar
          }
        } else if (shouldResumeOnFocus) {
          playMusic();
          shouldResumeOnFocus = false; // Ya no necesita reanudar
        }
      });

      // Acción al presionar "Sí, acepto"
      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta'); // Oculta la pantalla principal
        imagenAnimada.classList.add('activa'); // Activa la animación de la imagen
        botonAudio.classList.add('visible'); // Mostrar el botón de audio
        playMusic(); // Reproduce la música
      });
    });
  </script>
</body>
</html>
