<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-dorado: #DAA520;
      --color-gris-claro: #f5f5f5;
      --color-gris-oscuro: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    /* Imagen "welcome" centrada */
    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/welcome.jpg?raw=true'); /* Link de fondo */
      background-size: auto 100%; /* Ajusta al alto de la pantalla */
      background-position: center; /* Centra la imagen */
      background-repeat: no-repeat; /* Evita repetición */
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    /* Texto principal */
    .mensaje-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--color-verdeoliva); /* Color interno de las letras */
      font-weight: 700; /* Negrita */
      text-shadow: 2px 2px var(--color-blanco); /* Sombra para resaltar */
      -webkit-text-stroke: 1px var(--color-gris-oscuro); /* Borde gris oscuro alrededor de las letras */
    }

    /* Botón principal */
    .boton-aceptar {
      background-color: var(--color-verdeoliva);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: heartbeat 3s infinite; /* Latido más lento */
    }

    .boton-aceptar:hover {
      background-color: #5c6633;
      transform: translateY(-3px);
    }

    @keyframes heartbeat {
      0%, 50%, 100% {
        transform: scale(1);
      }
      25%, 75% {
        transform: scale(1.1); /* Efecto de latido */
      }
    }

    /* Imagen animada desde el borde inferior */
    .imagen-animada {
      position: fixed;
      bottom: -100%; /* Comienza fuera del borde inferior */
      left: 50%; /* Centra horizontalmente */
      transform: translateX(-50%); /* Ajusta el centro a la mitad */
      width: 100%; /* Ajustar al 100% del ancho */
      height: auto; /* Mantener la proporción */
      animation: entrarDesdeAbajo 3s ease-in-out forwards;
    }

    /* Clase para activar la animación */
    .imagen-animada.activa {
      animation: entrarDesdeAbajo 3s ease-in-out forwards;
    }

    /* Animación para que la imagen suba */
    @keyframes entrarDesdeAbajo {
      0% {
        bottom: -100%; /* Fuera de la pantalla */
      }
      100% {
        bottom: 0; /* Hasta el borde superior */
      }
    }

    /* Estilo para el ícono de scroll */
    .scroll-indicator {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: var(--color-verdeoliva);
      opacity: 0;
      animation: fadeIn 1s forwards;
      animation-delay: 2s; /* Aparece 2 segundos después */
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Pantalla Principal -->
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <!-- Imagen animada -->
  <img src="https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/manos.jpg?raw=true" alt="Imagen animada" class="imagen-animada" id="imagenAnimada">

  <!-- Indicador de scroll -->
  <div class="scroll-indicator" id="scrollIndicator" style="display: none;">
    ↓ Desliza hacia abajo ↓
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const imagenAnimada = document.getElementById('imagenAnimada');
      const scrollIndicator = document.getElementById('scrollIndicator');

      // Acción al presionar "Sí, acepto"
      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta'); // Oculta la pantalla principal
        imagenAnimada.classList.add('activa'); // Activa la animación de la imagen

        // Mostrar el indicador de scroll después de 2 segundos
        setTimeout(() => {
          scrollIndicator.style.display = 'block';
        }, 2000);
      });
    });
  </script>
</body>
</html>
