<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-dorado: #DAA520;
      --color-gris-claro: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    /* Pantalla principal */
    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/welcome.jpg?raw=true'); /* Agrega tu link de fondo */
      background-size: cover;
      background-position: center;
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    .mensaje-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--color-verdeoliva);
      font-weight: 700; /* Negrita */
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4); /* Sombra negra difuminada */
    }

    .boton-aceptar {
      background-color: var(--color-verdeoliva);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-family: 'Montserrat', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: heartbeat 3s infinite; /* Latido más lento */
    }

    .boton-aceptar:hover {
      background-color: #5c6633;
      transform: translateY(-3px);
    }

    @keyframes heartbeat {
      0%, 50%, 100% {
        transform: scale(1);
      }
      25%, 75% {
        transform: scale(1.1); /* Efecto de latido */
      }
    }

    /* Imagen ascendente */
    .imagen-ascendente {
      position: fixed;
      bottom: -100px; /* Comienza fuera de la pantalla */
      left: 0;
      width: 100%; /* Ajusta al ancho total de la pantalla */
      height: auto; /* Mantiene la proporción */
      opacity: 0;
      animation: subir 3s ease-in-out forwards;
      z-index: 50; /* Aparece debajo del fondo */
    }

    @keyframes subir {
      0% {
        bottom: -100px;
        opacity: 0;
      }
      100% {
        top: 0; /* Asciende hasta el borde superior de la pantalla */
        opacity: 1;
      }
    }

    /* Botón flotante de audio */
    .boton-audio {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--color-verdeoliva);
      color: white;
      display: none; /* Oculto inicialmente */
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 400;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border: none;
      transition: all 0.3s ease;
    }

    .boton-audio.visible {
      display: flex; /* Mostrar el botón cuando sea visible */
    }

    .boton-audio:hover {
      background-color: #5c6633;
      transform: scale(1.1);
    }

    .icono-audio {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .boton-audio.on .icono-audio {
      fill: var(--color-dorado); /* Cambiar color cuando está encendido */
}
    /* Contenedor de hojas */
.hojas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}

/* Estilo base de las hojas */
.hoja {
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: var(--color-verdeoliva);
  border-radius: 50%;
  animation: caer 5s linear forwards;
  opacity: 0.8;
}

/* Hojas doradas */
.hoja.dorada {
  background-color: var(--color-dorado);
  opacity: 0.9;
}

/* Hojas translúcidas */
.hoja.translucida {
  opacity: 0.5;
}

/* Animación de caída */
@keyframes caer {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(120vh) rotate(360deg);
    opacity: 0;
  }
}

/* Contenedor de hojas */
.hojas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}

/* Estilo base de las hojas */
.hoja {
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: var(--color-verdeoliva);
  border-radius: 50%;
  animation: caer 2s ease-out forwards;
  opacity: 1;
}

/* Hojas doradas */
.hoja.dorada {
  background-color: var(--color-dorado);
  opacity: 0.9;
}

/* Hojas translúcidas */
.hoja.translucida {
  opacity: 0.5;
}

/* Animación explosiva de caída */
@keyframes caer {
  0% {
    transform: translateY(-150px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(120vh) rotate(360deg);
    opacity: 0;
  }
}
    
  </style>
</head>
<body>
  <!-- Pantalla Principal -->
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <!-- Imagen ascendente -->
  <img src="https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/manos.jpg?raw=true" alt="Imagen decorativa" class="imagen-ascendente" id="imagenAscendente" />

  <!-- Música de fondo -->
  <audio id="musicaFondo" loop>
    <source src="https://raw.githubusercontent.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/main/musica.mp3" type="audio/mp3">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <!-- Botón flotante de control de audio -->
  <button class="boton-audio" id="botonAudio" aria-label="Control de música">
    <svg class="icono-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15 8a5 5 0 0 1 0 8"></path>
      <path d="M19 5a9 9 0 0 1 0 14"></path>
    </svg>
  </button>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const musicaFondo = document.getElementById('musicaFondo');
      const botonAudio = document.getElementById('botonAudio');
      const imagenAscendente = document.getElementById('imagenAscendente');

      let isPlaying = false;
      let shouldResumeOnFocus = false;

      // Reproducir música con inicio gradual
      function playMusic() {
        musicaFondo.volume = 0;
        musicaFondo.play();
        let fadeIn = setInterval(() => {
          if (musicaFondo.volume < 1) {
            musicaFondo.volume += 0.1;
          } else {
            clearInterval(fadeIn);
          }
        }, 100);
        isPlaying = true;
        botonAudio.classList.add('on'); // Cambiar estado del botón
      }

      // Pausar música
      function pauseMusic() {
        musicaFondo.pause();
        isPlaying = false;
        botonAudio.classList.remove('on'); // Cambiar estado del botón
      }

      // Alternar reproducción/pausa de música
      botonAudio.addEventListener('click', function () {
        if (isPlaying) {
          pauseMusic();
        } else {
          playMusic();
        }
      });

      // Pausar música automáticamente al salir de la pestaña
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (isPlaying) {
            pauseMusic();
            shouldResumeOnFocus = true; // Marcar que debe reanudar al regresar
          }
        } else if (shouldResumeOnFocus) {
          playMusic();
          shouldResumeOnFocus = false; // Ya no necesita reanudar
        }
      });

// Función para crear la lluvia de hojas
function crearLluviaDeHojas() {
  const hojasContainer = document.createElement('div');
  hojasContainer.classList.add('hojas');
  document.body.appendChild(hojasContainer);

  for (let i = 0; i < 120; i++) {
    const hoja = document.createElement('div');
    hoja.classList.add('hoja');
    if (Math.random() > 0.7) hoja.classList.add('dorada');
    if (Math.random() > 0.5) hoja.classList.add('translucida');
    hoja.style.left = Math.random() * 100 + 'vw';
    hoja.style.animationDelay = Math.random() * 2 + 's';
    hoja.style.animationDuration = Math.random() * 2 + 3 + 's';
    hojasContainer.appendChild(hoja);
  }

  setTimeout(() => {
    hojasContainer.remove();
  }, 7000);
}

// Función para crear la lluvia de hojas explosiva
function crearLluviaDeHojas() {
  const hojasContainer = document.createElement('div');
  hojasContainer.classList.add('hojas');
  document.body.appendChild(hojasContainer);

  for (let i = 0; i < 120; i++) {
    const hoja = document.createElement('div');
    hoja.classList.add('hoja');

    // Agregar clases adicionales para variaciones
    if (Math.random() > 0.7) hoja.classList.add('dorada');
    if (Math.random() > 0.5) hoja.classList.add('translucida');

    // Posición inicial explosiva (siempre fuera de pantalla superior)
    hoja.style.top = Math.random() * -50 + 'px'; // Posición aleatoria fuera de pantalla
    hoja.style.left = Math.random() * 100 + 'vw'; // Posición horizontal aleatoria
    hoja.style.animationDelay = Math.random() * 0.2 + 's'; // Leve retraso para efecto explosivo

    hojasContainer.appendChild(hoja);
  }

  // Eliminar las hojas después de la animación
  setTimeout(() => {
    hojasContainer.remove();
  }, 2000); // Duración total de la animación
}

botonAceptar.addEventListener('click', function () {
  pantallaPrincipal.classList.add('oculta');
  playMusic();
  botonAudio.classList.add('visible'); // Mostrar botón de audio
  crearLluviaDeHojas(); // Inicia la lluvia de hojas
});
      
      // Acción al presionar "Sí, acepto"
      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta');
        playMusic();
        botonAudio.classList.add('visible'); // Mostrar botón de audio
      });
    });
  </script>
</body>
</html>
