<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Invitación</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&family=Dancing+Script:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      --color-blanco: #ffffff;
      --color-verdeoliva: #8A9A5B;
      --color-dorado: #DAA520;
      --color-gris-claro: #f5f5f5;
      --color-gris-oscuro: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-gris-claro);
      color: #333;
      overflow-x: hidden;
    }

    /* Pantalla principal */
    .pantalla-principal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/welcome.jpg?raw=true');
      background-size: auto 100%;
      background-position: center;
      background-repeat: no-repeat;
      padding: 2rem;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: transform 1.5s ease;
    }

    .pantalla-principal.oculta {
      transform: translateY(-100%);
    }

    /* Texto principal */
    .mensaje-principal {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      line-height: 1.4;
      margin-bottom: 3rem;
      color: var(--color-verdeoliva);
      font-weight: 700;
      text-shadow: 2px 2px var(--color-blanco);
      -webkit-text-stroke: 1px var(--color-gris-oscuro);
    }

    /* Botón principal */
    .boton-aceptar {
      background-color: var(--color-verdeoliva);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: heartbeat 3s infinite;
    }

    .boton-aceptar:hover {
      background-color: #5c6633;
      transform: translateY(-3px);
    }

    @keyframes heartbeat {
      0%, 50%, 100% {
        transform: scale(1);
      }
      25%, 75% {
        transform: scale(1.1);
      }
    }

    /* Imagen animada desde el borde inferior */
    .imagen-animada {
      position: fixed;
      bottom: -100%; /* Inicialmente fuera de la pantalla */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: auto;
    }

    .imagen-animada.activa {
      animation: entrarDesdeAbajo 3s ease-in-out forwards;
    }

    @keyframes entrarDesdeAbajo {
      0% {
        bottom: -100%;
      }
      100% {
        bottom: 0;
      }
    }

    /* Botón de audio flotante */
    .boton-audio {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--color-verdeoliva);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 400;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .boton-audio.pausa {
      opacity: 0.5;
    }

    .icono-audio {
      width: 24px;
      height: 24px;
      fill: white;
    }

    /* Ícono animado de scroll */
    .scroll-indicator {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      color: var(--color-verdeoliva);
      display: none;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, -10px);
      }
    }
  </style>
</head>
<body>
  <!-- Pantalla Principal -->
  <div class="pantalla-principal" id="pantallaPrincipal">
    <h1 class="mensaje-principal">
      Cada familia<br />
      tiene su historia...<br />
      ¿te gustaría<br />
      participar en<br />
      la nuestra?
    </h1>
    <button class="boton-aceptar" id="botonAceptar">Sí, acepto</button>
  </div>

  <!-- Imagen animada -->
  <img src="https://github.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/blob/main/manos.jpg?raw=true" alt="Imagen animada" class="imagen-animada" id="imagenAnimada">

  <!-- Indicador de scroll -->
  <div class="scroll-indicator" id="scrollIndicator">⬇</div>

  <!-- Música de fondo -->
  <audio id="musicaFondo" loop>
    <source src="https://raw.githubusercontent.com/nuestrabodagarmazoni/invitacion-boda-karina-luis/main/musica.mp3" type="audio/mp3">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <!-- Botón flotante de control de audio -->
  <div class="boton-audio" id="botonAudio" aria-label="Control de música">
    <svg class="icono-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15 8a5 5 0 0 1 0 8"></path>
      <path d="M19 5a9 9 0 0 1 0 14"></path>
    </svg>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pantallaPrincipal = document.getElementById('pantallaPrincipal');
      const botonAceptar = document.getElementById('botonAceptar');
      const imagenAnimada = document.getElementById('imagenAnimada');
      const scrollIndicator = document.getElementById('scrollIndicator');
      const musicaFondo = document.getElementById('musicaFondo');
      const botonAudio = document.getElementById('botonAudio');

      let isPlaying = false;

      // Reproducir música
      function playMusic() {
        musicaFondo.play();
        isPlaying = true;
        botonAudio.classList.remove('pausa');
      }

      // Pausar música
      function pauseMusic() {
        musicaFondo.pause();
        isPlaying = false;
        botonAudio.classList.add('pausa');
      }

      // Alternar reproducción/pausa
      botonAudio.addEventListener('click', function () {
        if (isPlaying) {
          pauseMusic();
        } else {
          playMusic();
        }
      });

      // Acción al presionar "Sí, acepto"
      botonAceptar.addEventListener('click', function () {
        pantallaPrincipal.classList.add('oculta'); // Oculta la pantalla principal
        imagenAnimada.classList.add('activa'); // Activa la animación de la imagen

        // Mostrar el indicador de scroll después de 3 segundos
        setTimeout(() => {
          scrollIndicator.style.display = 'block';
        }, 3000);

        playMusic(); // Reproduce la música
      });
    });
  </script>
</body>
</html>
